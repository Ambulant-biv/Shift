# Builds Shift.exe on Windows and publishes it as a GitHub Release.
# Trigger: push a tag that matches version.py, e.g.  git tag v1.1.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches version.py
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match version.py ($version)"
            exit 1
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Shift.exe
        run: python -m PyInstaller shift.spec --noconfirm --clean

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Shift.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Shift.exe" | Out-File -Encoding ascii dist/Shift.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shift.exe
            dist/Shift.exe.sha256
          generate_release_notes: true
